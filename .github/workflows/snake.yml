name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d08a1c&color_dots=#ebedf0,#fde7c2,#f8c877,#f5b14c,#d08a1c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5b14c&color_dots=#161b22,#3d2e14,#7a5520,#c7882f,#f5b14c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
